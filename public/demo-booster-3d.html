<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booster Pack — Three.js 3D Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#060a0c;color:#d0d8d4;font-family:'Cinzel',serif;overflow:hidden}
  canvas{display:block}
  .title{position:fixed;top:20px;left:50%;transform:translateX(-50%);font-size:1rem;color:#00dca8;letter-spacing:2px;z-index:10;text-shadow:0 0 20px rgba(0,220,168,0.3)}
  .hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:0.45rem;color:#00dca8;letter-spacing:2px;text-transform:uppercase;opacity:0.5;z-index:10;transition:opacity 0.4s}
  .counter{position:fixed;top:60px;left:50%;transform:translateX(-50%);font-size:0.6rem;color:#c8a830;letter-spacing:2px;z-index:10;opacity:0;transition:opacity 0.4s}
  .summary{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;opacity:0;transition:opacity 0.6s;pointer-events:none}
  .summary.show{opacity:1}
  .summary img{width:50px;height:auto;border-radius:3px;border:1px solid rgba(0,220,168,0.2);opacity:0;transition:opacity 0.4s}
  .summary img.revealed{opacity:1}
  .result-overlay{position:fixed;inset:0;background:rgba(6,10,12,0.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;opacity:0;transform:translateY(40px);transition:opacity 0.6s ease,transform 0.6s ease;pointer-events:none;cursor:pointer}
  .result-overlay.show{opacity:1;transform:translateY(0);pointer-events:all}
  .result-title{font-size:0.8rem;color:#00dca8;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 20px rgba(0,220,168,0.3)}
  .result-cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;max-width:90vw}
  .result-cards img{width:120px;height:auto;border-radius:4px;border:1px solid rgba(200,168,48,0.3);opacity:0;transform:translateY(30px);transition:opacity 0.4s ease,transform 0.4s ease}
  .result-cards img.show{opacity:1;transform:translateY(0)}
  .result-hint{font-size:0.35rem;color:rgba(0,220,168,0.4);letter-spacing:2px;text-transform:uppercase;margin-top:10px}
</style>
</head>
<body>
<h1 class="title">Legend of Blue Eyes White Dragon</h1>
<p class="hint" id="hint">Klicken + ziehen zum Drehen &middot; Scrollen zum Zoomen</p>
<p class="counter" id="counter"></p>
<div class="summary" id="summary"></div>
<div class="result-overlay" id="resultOverlay">
  <p class="result-title">Deine Karten</p>
  <div class="result-cards" id="resultCards"></div>
  <p class="result-hint">Klicken zum Schliessen</p>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ===== CONFIG =====
const PACK_W = 1.5, PACK_H = 2.2, PACK_D = 0.08, CORNER_R = 0.04;
const CW = 1024, CH = 1496, SHOWCASE_H = 1040;
const CARD_W = 160, CARD_H = 233, CARD_GAP = 12;

const FOIL_MAT = { roughness: 0.35, metalness: 0.15, envMapIntensity: 1.5 };
const SIDE_MAT = { roughness: 0.6, metalness: 0.05 };

const PULL_CARD_IDS = ['89631139','74677425','70903634','8124921','44519536','6368038'];
const CARD_3D_W = 0.85, CARD_3D_H = CARD_3D_W * 86 / 59;

// ===== STATE =====
const PHASE = { PACK: 0, RESET_VIEW: 1, FLAP_OPEN: 2, PACK_FADE: 3, CARDS_EMERGE: 4, CARD_VIEW: 5 };
let phase = PHASE.PACK;
let phaseTime = 0;
let swipeDir = 1;
let swipeStartX = 0;
let swipingFlap = false;
let currentCardIdx = 0;

// Reusable vector to avoid per-frame allocations
const ORIGIN = new THREE.Vector3(0, 0, 0);

// ===== SCENE =====
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a0c);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.3, 6.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// ===== CONTROLS =====
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.15;
controls.minDistance = 3.5;
controls.maxDistance = 12;
controls.rotateSpeed = 1.5;
controls.minPolarAngle = Math.PI * 0.05;
controls.maxPolarAngle = Math.PI;
controls.autoRotate = true;
controls.autoRotateSpeed = 2;
renderer.domElement.addEventListener('pointerdown', () => { controls.autoRotate = false; }, { once: true });

// ===== LIGHTING =====
scene.add(new THREE.AmbientLight(0xffffff, 0.4));

const addLight = (color, intensity, pos) => {
  const l = new THREE.DirectionalLight(color, intensity);
  l.position.set(...pos);
  scene.add(l);
};
addLight(0xffffff, 1.2, [3, 4, 5]);
addLight(0x00dca8, 0.3, [-3, 2, -3]);
addLight(0xc8a830, 0.2, [0, -2, -4]);
addLight(0xffffff, 1.0, [-3, 4, -5]);

const pl = new THREE.PointLight(0x00dca8, 0.5, 10);
pl.position.set(0, 0, 3);
scene.add(pl);

// ===== ENV MAP =====
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x0a1a14);
const envL1 = new THREE.PointLight(0x00dca8, 2, 10); envL1.position.set(2, 2, 2); envScene.add(envL1);
const envL2 = new THREE.PointLight(0xc8a830, 1, 10); envL2.position.set(-2, -1, -2); envScene.add(envL2);
scene.environment = pmrem.fromScene(envScene).texture;

// ===== IMAGE LOADER =====
function loadImages(ids) {
  const imgs = new Array(ids.length);
  let count = 0;
  ids.forEach((id, i) => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => { imgs[i] = img; count++; };
    img.src = `/images/cards/${id}.jpg`;
  });
  return imgs;
}

function padArray(arr, minLen) {
  if (arr.length >= minLen) return arr;
  const result = [...arr];
  while (result.length < minLen) result.push(...arr);
  return result.slice(0, minLen);
}

// ===== LOAD CARD IMAGES (for pack textures) =====
const bgImgs = loadImages(['39004808','73134081','84686841','93553943','12580477','43500484','1435851','10202894','85705804','77027445']);
const scImgs = loadImages(['74677425','36996508','89631140']);
const backItemImgs = loadImages(['92731455','76103675','4206964']);
const rareImgs = loadImages(['4206964','91152256','66889139','53129443','74677425','6368038','54652250','33396948','12580477','72302403']);
const monsterImgs = loadImages(['91152256','53153481','63308047','36121917','53375573','15025844','76211194','93553943','39111158','57305373']);
const spellImgs = loadImages(['51482758','91595718','46009906','51267887','4614116','46130346','12580477','72302403','86318356','82542267']);
const trapImgs = loadImages(padArray(['83887306','50045299','4206964'], 10));

const showcasePos = [
  { x: 160, y: 200, w: 280, h: 408 },
  { x: 370, y: 300, w: 280, h: 408 },
  { x: 580, y: 400, w: 280, h: 408 },
];

// ===== CANVAS TEXTURES =====
function makeCanvas() {
  const c = document.createElement('canvas');
  c.width = CW; c.height = CH;
  return c;
}

const frontCanvas = makeCanvas();
const frontTex = new THREE.CanvasTexture(frontCanvas);
frontTex.colorSpace = THREE.SRGBColorSpace;

const backCanvas = makeCanvas();
const backTex = new THREE.CanvasTexture(backCanvas);
backTex.colorSpace = THREE.SRGBColorSpace;

// ===== SIDE TEXTURE =====
const sideCanvas = document.createElement('canvas');
sideCanvas.width = 64; sideCanvas.height = 748;
const sctx = sideCanvas.getContext('2d');
const sg = sctx.createLinearGradient(0, 0, 0, 748);
sg.addColorStop(0, '#0a2e24'); sg.addColorStop(1, '#071e18');
sctx.fillStyle = sg; sctx.fillRect(0, 0, 64, 748);
sctx.save(); sctx.translate(32, 374); sctx.rotate(-Math.PI / 2);
sctx.fillStyle = 'rgba(0,220,168,0.1)'; sctx.font = '700 14px Cinzel, serif'; sctx.textAlign = 'center';
sctx.fillText('LOB', 0, 5); sctx.restore();
const sideTex = new THREE.CanvasTexture(sideCanvas);
sideTex.colorSpace = THREE.SRGBColorSpace;

// ===== BUILD PACK =====
const packGroup = new THREE.Group();

const bodyGeo = new RoundedBoxGeometry(PACK_W, PACK_H, PACK_D, 4, CORNER_R);
const frontMat = new THREE.MeshStandardMaterial({ map: frontTex, ...FOIL_MAT });
const backMat = new THREE.MeshStandardMaterial({ map: backTex, ...FOIL_MAT });
const sideMat = new THREE.MeshStandardMaterial({ map: sideTex, ...SIDE_MAT });
const topMat = new THREE.MeshStandardMaterial({ color: 0x0d3c30, roughness: 0.6, metalness: 0.1 });

const packBody = new THREE.Mesh(bodyGeo, [sideMat, sideMat, topMat, topMat, frontMat, backMat]);
packGroup.add(packBody);

// Tear flap
const flapPivot = new THREE.Group();
flapPivot.position.set(0, PACK_H / 2, 0);

const flapGeo = new RoundedBoxGeometry(PACK_W * 0.92, 0.13, PACK_D * 0.5, 3, 0.02);
const flapCanvas = document.createElement('canvas');
flapCanvas.width = 512; flapCanvas.height = 64;
const fctx = flapCanvas.getContext('2d');
fctx.fillStyle = '#0e4236'; fctx.fillRect(0, 0, 512, 64);
for (let x = 30; x < 480; x += 12) { fctx.fillStyle = 'rgba(0,220,168,0.35)'; fctx.fillRect(x, 28, 6, 2); }
fctx.fillStyle = 'rgba(0,220,168,0.4)'; fctx.font = '24px sans-serif';
fctx.fillText('\u2702', 8, 38);
fctx.save(); fctx.translate(500, 38); fctx.scale(-1, 1); fctx.fillText('\u2702', 0, 0); fctx.restore();
const flapTex = new THREE.CanvasTexture(flapCanvas); flapTex.colorSpace = THREE.SRGBColorSpace;
const flapMat = new THREE.MeshStandardMaterial({ map: flapTex, roughness: 0.5, metalness: 0.1 });
const flapSideMat = new THREE.MeshStandardMaterial({ color: 0x0a3028, ...SIDE_MAT });
const flap = new THREE.Mesh(flapGeo, [flapSideMat, flapSideMat, flapSideMat, flapSideMat, flapMat, flapMat]);
flap.position.set(0, 0.13 / 2 + 0.01, 0);
flap.userData.isFlap = true;
flapPivot.add(flap);
packGroup.add(flapPivot);

scene.add(packGroup);

// ===== PULL CARDS (face-up, stacked) =====
const cardsGroup = new THREE.Group();
cardsGroup.visible = false;
cardsGroup.position.z = 4;
scene.add(cardsGroup);

const maxAniso = renderer.capabilities.getMaxAnisotropy();
const cardBackTex = new THREE.TextureLoader().load('/images/card_back/default.png');
cardBackTex.colorSpace = THREE.SRGBColorSpace;
cardBackTex.anisotropy = maxAniso;

const cardGeo = new THREE.PlaneGeometry(CARD_3D_W, CARD_3D_H);
const cardMeshes = [];

PULL_CARD_IDS.forEach((id, i) => {
  const frontTx = new THREE.TextureLoader().load(`/images/cards/${id}.jpg`);
  frontTx.colorSpace = THREE.SRGBColorSpace;
  frontTx.anisotropy = maxAniso;

  const group = new THREE.Group();
  group.add(new THREE.Mesh(cardGeo, new THREE.MeshBasicMaterial({ map: frontTx, toneMapped: false })));
  group.add(new THREE.Mesh(cardGeo, new THREE.MeshBasicMaterial({ map: cardBackTex, side: THREE.BackSide, toneMapped: false })));

  group.position.set(0, 0.3, (PULL_CARD_IDS.length - i) * 0.001);
  group.visible = false;
  cardsGroup.add(group);
  cardMeshes.push(group);
});

// ===== SUMMARY THUMBNAILS =====
const summaryEl = document.getElementById('summary');
PULL_CARD_IDS.forEach(id => {
  const img = document.createElement('img');
  img.src = `/images/cards/${id}.jpg`;
  summaryEl.appendChild(img);
});

// ===== UI REFS =====
const hintEl = document.getElementById('hint');
const counterEl = document.getElementById('counter');

// ===== INPUT HANDLING =====
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

let draggingCard = false;
let dragStartX = 0;
let cardSwiping = false;
let cardSwipeTime = 0;
let cardSwipeDir = 1;
let resetViewFrom = null;
const defaultCamPos = new THREE.Vector3(0, 0.3, 8);

let lastMoveTime = 0;
renderer.domElement.addEventListener('pointermove', (e) => {
  // Card drag during CARD_VIEW
  if (phase === PHASE.CARD_VIEW && draggingCard) {
    const dx = e.clientX - dragStartX;
    const topCard = cardMeshes[currentCardIdx];
    topCard.position.x = dx * 0.004;
    topCard.rotation.z = -dx * 0.0004;
    renderer.domElement.style.cursor = 'grabbing';
    return;
  }
  // Skip raycaster during non-pack phases
  if (phase !== PHASE.PACK) {
    renderer.domElement.style.cursor = phase === PHASE.CARD_VIEW ? 'grab' : 'default';
    return;
  }
  // Throttled hover cursor for pack phase
  const now = performance.now();
  if (now - lastMoveTime < 80) return;
  lastMoveTime = now;
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(packGroup.children, true);
  const onFlap = hits.some(h => h.object.userData.isFlap);
  renderer.domElement.style.cursor = onFlap ? 'pointer' : hits.length > 0 ? 'grab' : 'default';
});

renderer.domElement.addEventListener('pointerdown', (e) => {
  // Card interaction
  if (phase === PHASE.CARD_VIEW && !cardSwiping && currentCardIdx < PULL_CARD_IDS.length) {
    draggingCard = true;
    dragStartX = e.clientX;
    return;
  }
  // Flap interaction (pack phase only)
  if (phase !== PHASE.PACK) return;
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(packGroup.children, true);
  if (hits.some(h => h.object.userData.isFlap)) {
    controls.enableRotate = false;
    swipingFlap = true;
    swipeStartX = e.clientX;
  } else {
    renderer.domElement.style.cursor = 'grabbing';
  }
});

renderer.domElement.addEventListener('pointerup', (e) => {
  renderer.domElement.style.cursor = 'default';

  // Card swipe release
  if (draggingCard) {
    draggingCard = false;
    const dx = e.clientX - dragStartX;
    const topCard = cardMeshes[currentCardIdx];
    if (Math.abs(dx) > 50) {
      cardSwiping = true;
      cardSwipeTime = 0;
      cardSwipeDir = dx > 0 ? 1 : -1;
    } else {
      topCard.position.x = 0;
      topCard.rotation.z = 0;
    }
    return;
  }

  controls.enableRotate = true;

  if (swipingFlap && phase === PHASE.PACK) {
    const dx = e.clientX - swipeStartX;
    if (Math.abs(dx) > 20) {
      swipeDir = dx >= 0 ? 1 : -1;
      phase = PHASE.RESET_VIEW;
      phaseTime = 0;
      resetViewFrom = camera.position.clone();
      controls.autoRotate = false;
      controls.enableRotate = false;
    }
    swipingFlap = false;
  }
});

// ===== DRAWING HELPERS =====
function drawBg(ctx, colors) {
  const g = ctx.createLinearGradient(0, 0, CW, CH);
  g.addColorStop(0, colors[0]); g.addColorStop(0.5, colors[1]); g.addColorStop(1, colors[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
}

function drawScrollRows(ctx, rows) {
  ctx.globalAlpha = 0.12;
  rows.forEach(row => {
    const imgs = row.imgs.filter(Boolean);
    if (!imgs.length) return;
    const trackW = imgs.length * (CARD_W + CARD_GAP);
    const offset = row.t * row.speed * row.dir;
    for (let i = 0; i < imgs.length; i++) {
      let x = i * (CARD_W + CARD_GAP) + offset;
      x = ((x % trackW) + trackW) % trackW - CARD_W;
      if (x > -CARD_W && x < CW) ctx.drawImage(imgs[i], x, row.y, CARD_W, CARD_H);
      const x2 = x + trackW;
      if (x2 > -CARD_W && x2 < CW) ctx.drawImage(imgs[i], x2, row.y, CARD_W, CARD_H);
    }
  });
  ctx.globalAlpha = 1;
}

// ===== FRONT FRAME =====
function drawFrontFrame(ctx, t) {
  drawBg(ctx, ['#082a22', '#0d3c30', '#0a2e24']);
  ctx.fillRect(0, 0, CW, SHOWCASE_H);

  drawScrollRows(ctx, [
    { y: 85,  speed: 30, dir: 1,  imgs: bgImgs, t },
    { y: 403, speed: 38, dir: -1, imgs: bgImgs, t },
    { y: 721, speed: 33, dir: 1,  imgs: bgImgs, t },
  ]);

  ctx.fillStyle = 'rgba(4,14,10,0.95)';
  ctx.fillRect(0, SHOWCASE_H, CW, CH - SHOWCASE_H);

  ctx.fillStyle = 'rgba(0,220,168,0.15)'; ctx.strokeStyle = 'rgba(0,220,168,0.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(780, 50, 200, 56, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#00dca8'; ctx.font = '600 26px Cinzel, serif'; ctx.textAlign = 'center';
  ctx.fillText('WAVE 1', 880, 88);

  showcasePos.forEach((cp, i) => { if (scImgs[i]) ctx.drawImage(scImgs[i], cp.x, cp.y, cp.w, cp.h); });

  ctx.fillStyle = '#d0d8d4'; ctx.font = '700 44px Cinzel, serif'; ctx.textAlign = 'left';
  ctx.fillText('Legend of Blue Eyes', 60, 1136);
  ctx.fillText('White Dragon', 60, 1188);
  ctx.fillStyle = 'rgba(176,192,184,0.5)'; ctx.font = '500 32px Cinzel, serif';
  ctx.fillText('Das allererste Booster-Set.', 60, 1260);
  ctx.fillText('Blue-Eyes White Dragon,', 60, 1300);
  ctx.fillText('Dark Magician und...', 60, 1340);
  ctx.fillStyle = '#c8a830'; ctx.font = '700 44px Cinzel, serif';
  ctx.fillText('120 DP', 60, 1440);
  ctx.fillStyle = 'rgba(58,74,66,0.8)'; ctx.font = '600 28px Cinzel, serif'; ctx.textAlign = 'right';
  ctx.fillText('6 Cards Included', 960, 1440);
}

// ===== BACK FRAME =====
function drawBackFrame(ctx, t) {
  drawBg(ctx, ['#082a22', '#0d3c30', '#0a2e24']);

  drawScrollRows(ctx, [
    { y: 100,  speed: 30, dir: 1,  imgs: rareImgs,   t },
    { y: 400,  speed: 38, dir: -1, imgs: monsterImgs, t },
    { y: 700,  speed: 33, dir: 1,  imgs: spellImgs,   t },
    { y: 1000, speed: 35, dir: -1, imgs: trapImgs,    t },
  ]);

  ctx.fillStyle = '#d0d8d4'; ctx.font = '700 34px Cinzel, serif'; ctx.textAlign = 'center';
  ctx.fillText('Legend of Blue Eyes', 512, 65);
  ctx.fillText('White Dragon', 512, 105);
  ctx.fillStyle = 'rgba(176,192,184,0.5)'; ctx.font = '600 24px Cinzel, serif';
  ctx.fillText('126 Karten \u00B7 6 pro Pack', 512, 155);

  const rarities = [
    { text: '2 Secret Rare', color: 'rainbow' },
    { text: '8 Ultra Rare',  color: '#c44a6a' },
    { text: '15 Super Rare', color: '#d4a44a' },
    { text: '32 Rare',       color: '#4a90d9' },
    { text: '69 Common',     color: '#9a9a9a' },
  ];
  rarities.forEach((r, i) => {
    ctx.font = '600 20px Cinzel, serif'; ctx.textAlign = 'center';
    const y = 200 + i * 30;
    if (r.color === 'rainbow') {
      const rg = ctx.createLinearGradient(512 - 80, 0, 512 + 80, 0);
      rg.addColorStop(0, '#ff4444'); rg.addColorStop(0.2, '#ff9944'); rg.addColorStop(0.4, '#eedd44');
      rg.addColorStop(0.6, '#44dd66'); rg.addColorStop(0.8, '#4488ff'); rg.addColorStop(1, '#aa44ff');
      ctx.fillStyle = rg;
    } else {
      ctx.fillStyle = r.color;
    }
    ctx.fillText(r.text, 512, y);
  });

  const items = [
    { label: 'Monster', count: '87', y: 400 },
    { label: 'Zauber',  count: '36', y: 700 },
    { label: 'Fallen',  count: '3',  y: 1000 },
  ];
  items.forEach((item, i) => {
    if (backItemImgs[i]) ctx.drawImage(backItemImgs[i], 60, item.y, CARD_W, CARD_H);
    ctx.fillStyle = '#d0d8d4'; ctx.font = '700 32px Cinzel, serif'; ctx.textAlign = 'left';
    ctx.fillText(item.label, 260, item.y + 60);
    ctx.fillStyle = 'rgba(176,192,184,0.6)'; ctx.font = '600 26px Cinzel, serif';
    ctx.fillText(item.count + ' Karten', 260, item.y + 100);
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(176,192,184,0.4)'; ctx.font = '500 20px Cinzel, serif';
  ctx.fillText('OG Release: 08.03.2002', 512, 1320);
  ctx.fillText('In-Game Release: 15.01.2026', 512, 1355);
  ctx.strokeStyle = 'rgba(0,220,168,0.1)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(350, 1380); ctx.lineTo(674, 1380); ctx.stroke();
  ctx.fillStyle = 'rgba(0,220,168,0.3)'; ctx.font = '700 22px Cinzel, serif';
  ctx.fillText('Duel Monsters Classic', 512, 1410);
}

// ===== EASING =====
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

// ===== RESULT OVERLAY =====
function showResultOverlay() {
  const overlay = document.getElementById('resultOverlay');
  const grid = document.getElementById('resultCards');
  grid.innerHTML = '';

  PULL_CARD_IDS.forEach((id, i) => {
    const img = document.createElement('img');
    img.src = `/images/cards/${id}.jpg`;
    grid.appendChild(img);
    setTimeout(() => img.classList.add('show'), 150 + i * 100);
  });

  requestAnimationFrame(() => overlay.classList.add('show'));
}

document.getElementById('resultOverlay').addEventListener('click', () => {
  document.getElementById('resultOverlay').classList.remove('show');
});

// ===== ANIMATION =====
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  // ----- RESET VIEW (camera moves to front) -----
  if (phase === PHASE.RESET_VIEW) {
    phaseTime += dt;
    const p = Math.min(phaseTime / 0.8, 1);
    const ease = easeOutCubic(p);
    camera.position.lerpVectors(resetViewFrom, defaultCamPos, ease);
    controls.target.lerp(ORIGIN, ease * 0.1 + 0.05);
    if (p >= 1) {
      phase = PHASE.FLAP_OPEN;
      phaseTime = 0;
    }
  }

  // ----- FLAP OPENS (slides off) -----
  if (phase === PHASE.FLAP_OPEN) {
    phaseTime += dt;
    const p = Math.min(phaseTime / 1.2, 1);
    const ease = 1 - Math.pow(1 - p, 2);
    flap.position.x = ease * 2 * swipeDir;
    flap.rotation.z = -ease * 0.3 * swipeDir;
    flap.material.forEach(m => { m.transparent = true; m.opacity = 1 - ease; });
    if (p >= 1) {
      packGroup.remove(flapPivot);
      phase = PHASE.PACK_FADE;
      phaseTime = 0;
      hintEl.style.opacity = '0';
    }
  }

  // ----- PACK SLIDES DOWN AND OUT -----
  if (phase === PHASE.PACK_FADE) {
    phaseTime += dt;
    const p = Math.min(phaseTime / 1.4, 1);
    const ease = p * p * p; // easeInCubic — accelerates out

    packGroup.position.y = -ease * 5;
    const fadeP = Math.max(0, (p - 0.3) / 0.7);
    packBody.material.forEach(m => {
      m.transparent = true;
      m.opacity = 1 - fadeP;
    });

    if (p >= 1) {
      packGroup.visible = false;
      phase = PHASE.CARDS_EMERGE;
      phaseTime = 0;
      cardsGroup.visible = true;
      cardMeshes.forEach(c => c.visible = true);
    }
  }

  // ----- CARDS EMERGE (stack slides in from top) -----
  if (phase === PHASE.CARDS_EMERGE) {
    phaseTime += dt;
    const p = Math.min(phaseTime / 0.8, 1);
    const ease = easeOutCubic(p);

    cardsGroup.position.y = (1 - ease) * 2;

    cardMeshes.forEach(card => {
      card.children.forEach(child => {
        child.material.transparent = true;
        child.material.opacity = ease;
      });
    });

    if (p >= 1) {
      phase = PHASE.CARD_VIEW;
      phaseTime = 0;
      currentCardIdx = 0;
      controls.enableRotate = false;
      controls.enableZoom = false;
      controls.enablePan = false;

      counterEl.textContent = `1 / ${PULL_CARD_IDS.length}`;
      counterEl.style.opacity = '1';
      hintEl.textContent = 'Wische nach links oder rechts';
      hintEl.style.opacity = '0.5';
      summaryEl.classList.add('show');
    }
  }

  // ----- CARD SWIPE AWAY ANIMATION -----
  if (cardSwiping) {
    cardSwipeTime += dt;
    const p = Math.min(cardSwipeTime / 0.5, 1);
    const ease = easeOutCubic(p);
    const card = cardMeshes[currentCardIdx];
    card.position.x = ease * 5 * cardSwipeDir;
    card.rotation.z = -ease * 0.3 * cardSwipeDir;
    card.children.forEach(child => {
      child.material.transparent = true;
      child.material.opacity = 1 - ease;
    });

    if (p >= 1) {
      card.visible = false;
      cardSwiping = false;

      summaryEl.children[currentCardIdx].classList.add('revealed');

      currentCardIdx++;
      if (currentCardIdx < PULL_CARD_IDS.length) {
        cardMeshes[currentCardIdx].children.forEach(child => {
          child.material.transparent = false;
          child.material.opacity = 1;
        });
        counterEl.textContent = `${currentCardIdx + 1} / ${PULL_CARD_IDS.length}`;
      } else {
        counterEl.style.opacity = '0';
        hintEl.style.opacity = '0';
        summaryEl.classList.remove('show');
        showResultOverlay();
      }
    }
  }

  // ----- PACK TEXTURE UPDATES -----
  if (packGroup.visible) {
    drawFrontFrame(frontCanvas.getContext('2d'), t);
    frontTex.needsUpdate = true;
    drawBackFrame(backCanvas.getContext('2d'), t);
    backTex.needsUpdate = true;
    packGroup.rotation.x = Math.sin(t * 0.5) * 0.02;
  }

  // Subtle card bob during view
  if (phase === PHASE.CARD_VIEW && !cardSwiping && currentCardIdx < PULL_CARD_IDS.length) {
    cardMeshes[currentCardIdx].position.y = 0.3 + Math.sin(t * 1.5) * 0.015;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
